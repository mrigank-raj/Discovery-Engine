name: Discovery Pipeline (Twice Weekly)

on:
  schedule:
    # Runs at 03:00 UTC every Monday and Thursday.
    # Split into two smaller runs per week (each capped at 250 records,
    # per MAX_FILTER_PER_RUN) rather than one larger weekly run, so total
    # weekly throughput stays similar while each individual run reliably
    # completes instead of running into sustained Groq rate-limiting.
    - cron: '0 3 * * 1'
    - cron: '0 3 * * 4'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline Mode (incremental or backfill)'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - backfill

concurrency:
  group: discovery-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          # Use workflow input mode if triggered manually, otherwise default to incremental
          MODE="${{ github.event.inputs.mode || 'incremental' }}"
          echo "Running pipeline in $MODE mode..."
          python pipeline.py --mode $MODE
